{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Users</h2>
  <a href="{{ url_for('main.new_user') }}" class="btn btn-beige">Create User</a>
</div>
<div class="card bg-midnight border-0 shadow-sm">
  <div class="card-body">
    <table class="table table-dark table-hover align-middle">
      <thead>
        <tr><th>Name</th><th>Email</th><th>Admin</th></tr>
      </thead>
      <tbody>
        {% for user in users %}
          <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ 'Yes' if user.is_admin else 'No' }}</td>
          </tr>
        {% else %}
          <tr><td colspan="3" class="text-center text-muted">No users.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
