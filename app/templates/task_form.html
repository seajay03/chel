{% extends 'base.html' %}
{% block content %}
<h2 class="mb-3">{{ 'Edit Task' if task else 'New Task' }} — {{ project.name }}</h2>
<div class="card bg-midnight border-0 shadow-sm">
  <div class="card-body">
    <form method="post">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label">Title</label>
          <input type="text" name="title" class="form-control" value="{{ task.title if task else '' }}" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Status</label>
          <select name="status" class="form-select">
            {% for status in ['Todo','In Progress','Done'] %}
              <option value="{{ status }}" {% if task and task.status==status %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Assigned To</label>
          <select name="assigned_to" class="form-select">
            <option value="">Unassigned</option>
            {% for user in users %}
              <option value="{{ user.id }}" {% if task and task.assigned_to==user.id %}selected{% endif %}>{{ user.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Due Date</label>
          <input type="date" name="due_date" class="form-control" value="{{ task.due_date }}">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="4">{{ task.description if task else '' }}</textarea>
        </div>
      </div>
      <button class="btn btn-beige mt-3" type="submit">Save</button>
      <a href="{{ url_for('main.project_detail', project_id=project.id) }}" class="btn btn-outline-light mt-3 ms-2">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
